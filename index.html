<!DOCTYPE html>
<html>
<head>
  <title>Stock Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <div class="search-box">
      <h1>Stock Search</h1>

      <label>Enter Stock Ticker Symbol <span>*</span></label>
      <input type="text" id="ticker" required>

      <br><br>

      <button onclick="searchStock()">Search</button>
      <button onclick="clearPage()">Clear</button>
    </div>

    <hr>

    <div id="error"></div>

    <div id="tabs" style="display:none;">
      <button class="tab active" onclick="showTab('outlook')">Company Outlook</button>
      <button class="tab" onclick="showTab('summary')">Stock Summary</button>
      <button class="tab" onclick="loadHistory()">Search History</button>
    </div>

    <div id="cacheMessage"></div>

    <div id="outlook" class="content"></div>
    <div id="summary" class="content" style="display:none;"></div>
    <div id="history" class="content" style="display:none;"></div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
